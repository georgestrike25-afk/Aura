name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar, probar y empaquetar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Recursos generados al día
        run: |
          python3 tools/aura_icons.py
          python3 tools/aura_anim.py
          python3 tools/aura_widgets.py
          git diff --stat --exit-code

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas unitarias
        run: |
          set -o pipefail
          ./gradlew :core:test :app:testDebugUnitTest 2>&1 | tee build.log || { echo "== Errores =="; grep -E "^e: |FAILED|AssertionError" build.log | head -60; exit 1; }

      # Firma: la clave vive en los secretos AURA_KEYSTORE_BASE64 / AURA_KEYSTORE_PASSWORD.
      # Si faltan, el build falla a propósito: crear una clave nueva rompería las actualizaciones
      # (habría que desinstalar Aura para instalar el APK nuevo).
      - name: Configurar firma
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.AURA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.AURA_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Faltan los secretos de firma AURA_KEYSTORE_BASE64 / AURA_KEYSTORE_PASSWORD"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/aura-release.p12"
          echo "AURA_STORE_FILE=$RUNNER_TEMP/aura-release.p12" >> "$GITHUB_ENV"
          echo "AURA_STORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: APK debug y release
        run: |
          set -o pipefail
          preview=()
          if [ "${GITHUB_REF_NAME}" = "aura-artistic-evolution-2" ]; then preview+=(-Paura.preview=true); fi
          ./gradlew :app:assembleDebug :app:assembleRelease "${preview[@]}" 2>&1 | tee build.log || { echo "== Errores de compilación =="; grep -E "^e: |error:|FAILED" build.log | head -60; exit 1; }

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Publicar APK en dist/
        if: github.event_name == 'push' && github.ref_name != 'aura-artistic-evolution-2' && steps.signing.outputs.signed == 'true'
        run: |
          mkdir -p dist
          rm -f dist/*.apk
          cp app/build/outputs/apk/release/app-release.apk dist/Aura.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "APK de Aura (${GITHUB_SHA::7}) [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done

      # Publicación: la versión estable «aura-latest» solo sale de main; cualquier otra rama publica en
      # su propia versión de prueba («<rama>-test»), así una rama experimental nunca pisa la estable.
      - name: Publicar APK (estable desde main, de prueba desde otras ramas)
        if: github.event_name == 'push' && github.ref_name != 'aura-artistic-evolution-2' && steps.signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            tag=aura-latest; title="Aura (última versión)"
          else
            tag="$(echo "${GITHUB_REF_NAME}" | tr -c 'A-Za-z0-9._-' '-' | sed 's/-*$//')-test"; title="Aura de prueba (${GITHUB_REF_NAME})"
          fi
          notes="APK release firmado de Aura. Rama ${GITHUB_REF_NAME}, commit ${GITHUB_SHA::7}, $(date -u '+%Y-%m-%d %H:%M UTC')."
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --title "$title" --notes "$notes" --prerelease --target "$GITHUB_SHA"
          else
            gh release edit "$tag" --notes "$notes"
          fi
          gh release upload "$tag" dist/Aura.apk --clobber
          echo "Descarga: https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/Aura.apk" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: aura-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            core/build/reports/
            app/build/reports/

  emulator:
    name: Widgets reales en emulador
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: build
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK de prueba
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest 2>&1 | tee build.log || { echo "== Errores de compilación =="; grep -E "^e: |error:|FAILED" build.log | head -60; exit 1; }

      - name: Pruebas instrumentadas y capturas
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell settings put system time_12_24 24
            adb shell settings put global hide_error_dialogs 1
            adb shell settings put secure anr_show_background 0
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true || echo "AURA_TESTS_FAILED" > /tmp/aura_failed
            mkdir -p shots
            timeout 60 adb exec-out run-as app.aura tar c files/aura-shots > shots.tar || true
            tar xf shots.tar -C shots || true
            timeout 20 adb shell dumpsys appwidget | grep -i "app.aura" | head -20 || true
            timeout 20 adb logcat -d -b crash | tail -60 || true
            ls -R shots || true

      - name: Guardar capturas en docs/capturas
        if: github.event_name == 'push'
        run: |
          src=shots/files/aura-shots
          [ -d "$src" ] || exit 0
          rm -rf docs/capturas && mkdir -p docs/capturas
          cp "$src"/*.png docs/capturas/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/capturas
          git commit -m "Capturas del emulador (${GITHUB_SHA::7}) [skip ci]" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: widget-screenshots
          path: shots/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-reports
          path: app/build/reports/androidTests/

      - name: Resultado
        run: |
          if [ -f /tmp/aura_failed ]; then
            echo "== Pruebas que fallaron =="
            find app/build/outputs/androidTest-results -name "*.xml" -exec grep -h -B1 -A4 "<failure" {} + | head -80 || true
            exit 1
          fi

  publish-preview:
    name: Publicar prueba de Aura 2
    if: github.event_name == 'push' && github.ref_name == 'aura-artistic-evolution-2'
    needs: [build, emulator]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aura-apk
          path: apk

      - name: Verificar identidad, firma y publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk="$(find apk -name app-release.apk -print -quit)"
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$tools/apksigner" verify --print-certs "$apk" | tee certificate.txt
          grep -Fiqx 'Signer #1 certificate SHA-256 digest: 1f6f0c68557969d4f59cc8281f86c09437ce3f94511c10471867908c92867c2c' certificate.txt
          "$tools/aapt" dump badging "$apk" > package.txt
          grep -F "package: name='app.aura.preview'" package.txt
          cp "$apk" Aura.apk
          tag=aura-artistic-evolution-2-test
          notes="APK firmado de Aura 2. Commit ${GITHUB_SHA::7}, instalable junto a Aura estable."
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$tag" Aura.apk --repo "$GITHUB_REPOSITORY" --title "Aura Artistic Evolution 2 · Prueba" --notes "$notes" --prerelease --latest=false --target "$GITHUB_SHA"
          else
            gh release upload "$tag" Aura.apk --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes "$notes"
          fi
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/Aura.apk" >> "$GITHUB_STEP_SUMMARY"
