name: "Signature: gestor para PC"

# Compila «Aura Signature» (gestor de fondos para Windows) y lo publica en dist/ y en la versión
# «aura-signature-pc». Las pruebas de la lógica corren antes, en Linux.
on:
  push:
    branches: [main, aura-signature-gallery]
    paths:
      - "tools/aura_signature*.py"
      - "tools/test_aura_signature*.py"
      - "tools/requirements-signature.txt"
      - ".github/workflows/signature-manager.yml"
  workflow_dispatch:

concurrency:
  group: signature-manager-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow==11.0.0
      - name: Pruebas de la lógica
        run: cd tools && python -m unittest test_aura_signature_sync -v

  windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet -r tools/requirements-signature.txt
      - name: Probar la galería y el visor con Tk
        run: cd tools && python -m unittest test_aura_signature_manager -v
      - name: Comprobar el ícono de la bandeja en Windows
        run: python -c "import pystray, pystray._win32; print('bandeja OK')"
      - name: Compilar AuraSignature.exe
        shell: bash
        run: |
          # Identificador de la compilación: el gestor lo compara con el publicado para actualizarse solo.
          echo "${GITHUB_SHA::12}" > tools/AuraSignature.version
          pyinstaller --noconfirm --onefile --windowed --name AuraSignature \
            --add-data "tools/AuraSignature.version;." \
            --icon tools/aura_signature.ico --paths tools \
            --collect-data sv_ttk --collect-all tkinterdnd2 \
            --hidden-import keyring.backends.Windows --hidden-import pystray._win32 \
            --add-data "tools/aura_signature.ico;." \
            tools/aura_signature_manager.py
          ls -la dist
      - name: Probar que arranca, se instala solo y borra la copia descargada
        shell: pwsh
        run: |
          # Se prueba una copia (como si estuviera en Descargas): el gestor se copia a su carpeta fija,
          # abre esa copia y borra la descargada.
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\Descargas" | Out-Null
          $dl = "$env:RUNNER_TEMP\Descargas\AuraSignature.exe"
          Copy-Item dist/AuraSignature.exe $dl
          Start-Process -FilePath $dl
          Start-Sleep -Seconds 20
          $installed = Join-Path $env:LOCALAPPDATA "Programs\Aura Signature\AuraSignature.exe"
          if (-not (Test-Path $installed)) { Write-Error "No se instaló en $installed"; exit 1 }
          if (-not (Get-Process AuraSignature -ErrorAction SilentlyContinue)) { Write-Error "El gestor instalado no quedó abierto"; exit 1 }
          if (Test-Path $dl) { Write-Error "No borró la copia descargada"; exit 1 }
          # El .exe de un solo archivo abre un segundo proceso: se cierran todos para liberar el archivo.
          Get-Process AuraSignature -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 3
      - uses: actions/upload-artifact@v4
        with:
          name: AuraSignature
          path: dist/AuraSignature.exe
      - name: Publicar en dist/ y en la versión aura-signature-pc
        if: github.ref_name == 'main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out && mv dist/AuraSignature.exe out/
          git fetch origin "$GITHUB_REF_NAME"
          git checkout -B publish "origin/$GITHUB_REF_NAME"
          mkdir -p dist && cp out/AuraSignature.exe dist/AuraSignature.exe
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/AuraSignature.exe
          git commit -m "Gestor Aura Signature para PC (${GITHUB_SHA::7}) [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break; sleep 5; done
          tag=aura-signature-pc
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "Aura Signature para PC" --notes "Gestor de fondos de Signature para Windows." --latest=false
          cp tools/AuraSignature.version out/AuraSignature.version
          # Primero el .exe y después la versión, así nadie ve una versión nueva sin su .exe.
          gh release upload "$tag" out/AuraSignature.exe --clobber
          gh release upload "$tag" out/AuraSignature.version --clobber
