name: Probar SMN
on:
  push:
    paths: [".github/workflows/probe-smn.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          for u in "https://aviationweather.gov/api/data/metar?ids=SACO&format=json&hours=3" \
                   "https://aviationweather.gov/api/data/metar?bbox=-31.8,-64.6,-31.0,-63.8&format=json" ; do
            echo "== $u"
            curl -sS -m 30 -A "Aura-weather-app (Android)" -D headers.txt -o body.json "$u" || true
            head -8 headers.txt || true
            python3 -c "
          import json
          d=json.load(open('body.json'))
          print('items',len(d))
          for x in d[:4]: print(json.dumps(x, ensure_ascii=False)[:1200])
          " || head -c 500 body.json
          done
