name: Probar SMN
on:
  push:
    paths: [".github/workflows/probe-smn.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          cat > p.py <<'PY'
          import json, sys
          try:
              d = json.load(open('body.json'))
          except Exception as e:
              print('no json', e, open('body.json', 'rb').read()[:400]); sys.exit()
          if isinstance(d, list):
              print('items', len(d)); print(json.dumps(d[0], ensure_ascii=False)[:900])
              for x in d:
                  if 'rdoba' in json.dumps(x, ensure_ascii=False): print('CBA', json.dumps(x, ensure_ascii=False)[:700])
          else:
              print(json.dumps(d, ensure_ascii=False)[:1500])
          PY
          for u in https://ws.smn.gob.ar/map_items/weather https://ws1.smn.gob.ar/v1/weather/location/4864; do
            echo "== $u"
            curl -sS -m 30 -A "Aura-weather-app (Android)" -D headers.txt -o body.json "$u" || true
            head -12 headers.txt || true
            python3 p.py
          done
